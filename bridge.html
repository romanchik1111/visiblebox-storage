<!doctype html>
<html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-gZ9uIAHB/avAkMBpHPpumgM5z1GP/UxhVJD2SgBOTyU='; connect-src 'none'; img-src 'none'; style-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; worker-src 'none'">
<title>VisibleBox</title></head><body><script>
(function () {
    "use strict";
    // A page embedded by another website cannot read or change this profile.
    if(window.top!==window.self){document.title="VISIBLEBOX_BLOCKED_FRAME";return;}
    var key="visiblebox_settings_v1",started=false,lastId=0;
    function object(value){return value && typeof value==="object" && !Array.isArray(value);}
    function keys(value,expected){return object(value) && Object.keys(value).sort().join(",")===expected;}
    function envelope(raw){
        if(typeof raw!=="string" || raw.length>2048)throw new Error("Invalid payload");
        var env=JSON.parse(raw),s=env&&env.settings;
        if(!keys(env,"revision,settings,version") || env.version!==1 || !Number.isSafeInteger(env.revision) || env.revision<0 ||
            env.revision>Math.min(9007199254740990,Date.now()+300000) ||
            !keys(s,"buffColor,crateColor,distancePercent,thicknessPercent") ||
            !Number.isInteger(s.distancePercent) || s.distancePercent<50 || s.distancePercent>250 || s.distancePercent%10 ||
            !Number.isInteger(s.thicknessPercent) || s.thicknessPercent<50 || s.thicknessPercent>200 || s.thicknessPercent%10 ||
            typeof s.crateColor!=="string" || !/^#[0-9A-F]{6}$/i.test(s.crateColor) ||
            typeof s.buffColor!=="string" || !/^#[0-9A-F]{6}$/i.test(s.buffColor))throw new Error("Invalid settings");
        return env;
    }
    function answer(reply){document.title="VISIBLEBOX_REPLY_V1:"+encodeURIComponent(JSON.stringify(reply));}
    function process(initial){
        if(!location.hash || location.hash.length>14000)return;
        var message;
        try{
            message=JSON.parse(decodeURIComponent(location.hash.slice(1)));
            if(keys(message,"key,nonce,op,version") && message.version===1 && message.op==="hello" && message.key===key &&
                Number.isSafeInteger(message.nonce) && message.nonce>0){
                started=true;document.title="VISIBLEBOX_READY_V1:"+message.nonce;return;
            }
            // Opening a crafted link or reloading an old save URL must never write preferences.
            if(initial || !started)return;
            if(!object(message) || message.version!==1 || !Number.isSafeInteger(message.id) || message.id<=lastId || message.id<=0 ||
                message.id>9007199254740990 || message.key!==key)throw new Error("Invalid request");
            lastId=message.id;
            var value=null,old,previous=null;
            if(message.op==="load" && keys(message,"id,key,op,version")){
                value=localStorage.getItem(key);
                if(value!==null)try{envelope(value);}catch(corrupt){localStorage.removeItem(key);value=null;}
            }else if(message.op==="save" && keys(message,"id,key,op,value,version")){
                var env=envelope(message.value);
                old=localStorage.getItem(key);
                try{previous=envelope(old);}catch(ignored){}
                // Only a fully validated old envelope can block a delayed writer.
                if(previous && previous.revision>env.revision)throw new Error("Stale revision");
                localStorage.setItem(key,message.value);
                if(localStorage.getItem(key)!==message.value)throw new Error("Write verification failed");
            }else throw new Error("Unknown operation");
            answer({id:message.id,ok:true,value:value});
        }catch(error){if(object(message) && Number.isSafeInteger(message.id) && message.id>0)answer({id:message.id,ok:false,value:null,
            error:String(error.name||"StorageError")+": "+String(error.message||error).slice(0,180)});}
    }
    addEventListener("hashchange",function(){process(false);});
    document.title="VISIBLEBOX_PAGE_LOADED_V1";
    process(true);
})();
</script></body></html>
